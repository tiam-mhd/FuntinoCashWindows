name: Windows build

on:
  push:
    branches: [main]
    paths:
      - "FuntinoControlCenter/**"
      - "FuntinoControlCenter.Tests/**"
      - ".github/workflows/build-windows.yml"
      - "README.md"
      - "INSTALL_FA.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x86
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Read product version
        shell: pwsh
        run: |
          $versionFile = Join-Path $env:GITHUB_WORKSPACE "FuntinoControlCenter\Build\Version.props"
          [xml]$versionXml = Get-Content -LiteralPath $versionFile -Raw
          $version = [string]$versionXml.Project.PropertyGroup.FuntinoProductVersion
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid product version: $version" }
          "PRODUCT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Rebuild Debug x86
        shell: cmd
        working-directory: FuntinoControlCenter
        run: msbuild FuntinoControlCenter.sln /t:Rebuild /p:Configuration=Debug /p:Platform="Any CPU" /verbosity:minimal
      - name: Run contract fixture tests
        shell: pwsh
        run: |
          $testExe = Join-Path $env:GITHUB_WORKSPACE "FuntinoControlCenter.Tests\bin\Debug\FuntinoControlCenter.Tests.exe"
          if (!(Test-Path -LiteralPath $testExe)) { throw "The Windows contract test executable was not built: $testExe" }
          & $testExe
          if ($LASTEXITCODE -ne 0) { throw "Windows contract tests failed with exit code $LASTEXITCODE." }
      - name: Rebuild Release x86
        shell: cmd
        working-directory: FuntinoControlCenter
        run: msbuild FuntinoControlCenter.sln /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal
      - name: Stage distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = Join-Path $env:GITHUB_WORKSPACE "FuntinoControlCenter"
          $release = Join-Path $project "bin\Release"
          $dist = Join-Path $env:RUNNER_TEMP "FuntinoControlCenter"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          if (!(Test-Path (Join-Path $release "FuntinoControlCenter.exe"))) {
            throw "MSBuild completed without producing FuntinoControlCenter.exe"
          }
          Copy-Item -Path (Join-Path $release "*") -Destination $dist -Recurse -Force
          Copy-Item -Path (Join-Path $project "README_FA.md") -Destination $dist -Force
          Copy-Item -LiteralPath (Join-Path $project "Build\Prerequisites.md") -Destination (Join-Path $dist "Prerequisites.md") -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "INSTALL_FA.md") -Destination (Join-Path $dist "INSTALL_FA.md") -Force
          $archive = Join-Path $env:GITHUB_WORKSPACE "FuntinoControlCenter_Windows_x86_$env:PRODUCT_VERSION.zip"
          Compress-Archive -Path (Join-Path $dist "*") -DestinationPath $archive -Force
      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: FuntinoControlCenter_Windows_x86-${{ env.PRODUCT_VERSION }}
          path: FuntinoControlCenter_Windows_x86_${{ env.PRODUCT_VERSION }}.zip
          if-no-files-found: error
          retention-days: 30
